
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask MongoDB Form</title>
</head>
<body>
    <h1>Submit Your Information</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('backend.submit_form') }}"
          method="POST">

        <label for="name">Name:</label>
        <input id="name" type="text" name="name"
               value="{{ form_data.get('name', '') }}" required>
        <br><br>

        <label for="email">Email:</label>
        <input id="email" type="email" name="email"
               value="{{ form_data.get('email', '') }}" required>
        <br><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required>{{ form_data.get('message', '') }}</textarea>
        <br><br>

        <button type="submit">Submit Data</button>
    </form>
</body>
</html>
